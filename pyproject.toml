[tool.briefcase]
project_name = "MuseLite"
bundle = "com.muselite"
version = "0.4.0"
license = "GPL-3.0-only"
author = "MuseLite"

[tool.briefcase.app.python]
formal_name = "MuseLite"
description = "Python Android agent with a local Linux sandbox"
sources = ["src/python", "src/muselite_py"]
requires = ["toga-android==0.5.6", "markdown-it-py==4.2.0"]

[tool.briefcase.app.python.android]
template = "template"
android_abis = ["arm64-v8a"]
min_os_version = "30"
android_manifest_application_attrs_extra_content = 'android:usesCleartextTraffic="true" android:extractNativeLibs="true"'
build_gradle_extra_content = """
chaquopy.defaultConfig.staticProxy("toga_android.widgets.internal.webview")
android {
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
"""
